<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f3f5" />
    <title>Lore</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1d26'/%3E%3Cpath d='M8 23 L16 10 L24 21 Z' fill='none' stroke='%2369b6d0' stroke-width='1.8' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='23' r='3.4' fill='%2369b6d0'/%3E%3Ccircle cx='24' cy='21' r='3.4' fill='%2369b6d0'/%3E%3Crect x='12.2' y='6.2' width='7.6' height='7.6' rx='1.8' fill='%23f5da4a'/%3E%3C/svg%3E" />
    <script>
      // Light by default; a saved choice (or ?theme=) wins. Before first paint, so no flash.
      (function () {
        var t = null;
        try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("lore-theme"); } catch (e) {}
        document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
