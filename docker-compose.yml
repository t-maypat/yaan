# Local stack: FalkorDB + Browser. The image's run.sh starts
#   redis-server $REDIS_ARGS --protected-mode no --dir /var/lib/falkordb/data --loadmodule falkordb.so $FALKORDB_ARGS
# Phase 1.4 adds ACL users; Phase 15 adds the api, web and TLS proxy services for deployment.
name: lore

services:
  falkordb:
    image: "falkordb/falkordb:${FALKORDB_TAG:?set FALKORDB_TAG in .env to a pinned release (docs/PLAN.md Phase 1)}"
    environment:
      # Graph-module limits (D014), set on purpose instead of the image's defaults (verified A17):
      # - TIMEOUT_DEFAULT is the write budget. Writes ignore the per-query TIMEOUT and are rolled
      #   back in full when they hit it, so batch big writes to stay well under 10 s.
      # - Reads take the per-query TIMEOUT (db.py always passes one) up to TIMEOUT_MAX; asking
      #   for more is an error.
      # - RESULTSET_SIZE -1: no silent truncation (the image's 10000 cut results without a
      #   warning); every read query carries its own LIMIT.
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 10000 TIMEOUT_MAX 120000 RESULTSET_SIZE -1 MAX_QUEUED_QUERIES 25"
      # Persistence (D013): a snapshot within 60 s of any change, plus a final save on a clean stop.
      REDIS_ARGS: "--save 60 1"
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:3000:3000" # FalkorDB Browser: local only, never public
    volumes:
      - falkordb-data:/var/lib/falkordb/data # = redis-server --dir (run.sh); verified A7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  falkordb-data:
