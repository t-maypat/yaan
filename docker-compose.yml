# Local stack: FalkorDB + Browser. The image's run.sh starts
#   redis-server $REDIS_ARGS --protected-mode no --dir /var/lib/falkordb/data --loadmodule falkordb.so $FALKORDB_ARGS
# Profile `app` adds the API serving the built UI (R2 W6); a TLS proxy is the deployment's.
name: lore

# Settings the API and the connector worker share (one image, two commands).
x-yaan: &yaan
  build: .
  image: lore-api
  env_file: .env
  environment:
    FALKORDB_HOST: falkordb # the service name, inside the compose network
    FALKORDB_PORT: "6379" # the container's port; .env's FALKORDB_PORT is the host's
  depends_on:
    falkordb:
      condition: service_healthy
  volumes:
    - ./data:/app/data # embedding model, caches, tokens, the live path's data (seeded)
    - ./snapshots:/app/snapshots
    # connector maps and the people directory (org mode): an edit applies on restart
    - ./connectors.yaml:/app/connectors.yaml:ro
    - ./people.yaml:/app/people.yaml:ro
  # Least privilege (H1, D108): an unprivileged user (on Linux, LORE_UID / LORE_GID = the owner
  # of ./data), a read-only filesystem apart from ./data and /tmp, no Linux capabilities, and
  # no way to gain privileges.
  user: "${LORE_UID:-10001}:${LORE_GID:-10001}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  # JSON log lines (22.4), rotated: at most 5 x 10 MB per container, so what the logs hold of
  # a person (ids, paths) ages out instead of growing forever
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  falkordb:
    image: "falkordb/falkordb:${FALKORDB_TAG:?set FALKORDB_TAG in .env to a pinned release}"
    environment:
      # Graph-module limits (D014), set on purpose instead of the image's defaults (verified A17):
      # - TIMEOUT_DEFAULT is the write budget. Writes ignore the per-query TIMEOUT and are rolled
      #   back in full when they hit it, so batch big writes to stay well under 10 s.
      # - Reads take the per-query TIMEOUT (db.py always passes one) up to TIMEOUT_MAX; asking
      #   for more is an error.
      # - RESULTSET_SIZE -1: no silent truncation (the image's 10000 cut results without a
      #   warning); every read query carries its own LIMIT.
      FALKORDB_ARGS: "TIMEOUT_DEFAULT 10000 TIMEOUT_MAX 120000 RESULTSET_SIZE -1 MAX_QUEUED_QUERIES 25"
      # Redis options. run.sh word-splits this unquoted, so passwords must have no spaces or
      # glob characters (`allkeys` / `allcommands` stand in for `~*` / `+@all` for that reason).
      # - Persistence (D013, D136): a snapshot within FALKORDB_SAVE (60 s) of any change, plus a
      #   final save on a clean stop. FALKORDB_APPENDONLY=yes adds an append-only file (at most
      #   ~1 s of writes lost in a crash instead of ~60 s; set FALKORDB_SAVE="3600 1" with it).
      #   Only for a NEW volume: over a volume that has only a snapshot it starts EMPTY. Switch
      #   a running server with `yaan persistence aof` first, which keeps the data.
      # - Memory (D136): FALKORDB_MAXMEMORY (2gb), noeviction. At the cap FalkorDB refuses every
      #   write, deletes included; reads go on. Yaan warns from 80% (/health, the Admin page).
      #   Leave the container room above the cap: a snapshot forks, and pages written meanwhile
      #   are copied.
      # - ACL users (D018, A12), recreated from these arguments at every start:
      #   default = admin, password required (redis-cli, the Browser, snapshots, config);
      #   writer  = graph commands only: no FLUSHALL, no CONFIG, no key commands; GRAPH.COPY for the
      #             demo reset (lore_herb -> lore_demo, D057);
      #   reader  = read and plan only. GRAPH.QUERY, GRAPH.PROFILE (it executes) and GRAPH.DELETE
      #             are refused, so a write can't even be sent: the second lock behind RO_QUERY.
      #   Both app users get INFO and CLIENT SETINFO because the falkordb client sends them on
      #   connect. Key access is ~* because FalkorDB declares even RO_QUERY as read-write on its key.
      REDIS_ARGS: >-
        --save ${FALKORDB_SAVE:-60 1}
        --appendonly ${FALKORDB_APPENDONLY:-no} --appendfsync everysec
        --maxmemory ${FALKORDB_MAXMEMORY:-2gb} --maxmemory-policy noeviction
        --user default on >${FALKORDB_ADMIN_PASSWORD:?set FALKORDB_ADMIN_PASSWORD in .env (see .env.example)} allkeys allcommands
        --user ${FALKORDB_WRITER_USER:-lore_writer} on >${FALKORDB_WRITER_PASSWORD:?set FALKORDB_WRITER_PASSWORD in .env} allkeys -@all
        +graph.query +graph.ro_query +graph.explain +graph.profile +graph.list +graph.delete +graph.copy
        +graph.constraint +graph.memory +ping +info +client|setinfo
        --user ${FALKORDB_READER_USER:-lore_reader} on >${FALKORDB_READER_PASSWORD:?set FALKORDB_READER_PASSWORD in .env} allkeys -@all
        +graph.ro_query +graph.explain +graph.list +ping +info +client|setinfo
      # redis-cli inside the container authenticates as the admin with this.
      REDISCLI_AUTH: "${FALKORDB_ADMIN_PASSWORD}"
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${FALKORDB_BROWSER_PORT:-3000}:3000" # FalkorDB Browser: local only, never public
    volumes:
      - falkordb-data:/var/lib/falkordb/data # = redis-server --dir (run.sh); verified A7
    healthcheck:
      # Check the reply, not the exit code: redis-cli exits 0 even on NOAUTH.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # always: comes back whenever Docker starts, e.g. after a reboot or a Docker Desktop quit (D034).
    restart: always

  # The API with the built web UI (R2 W6): docker compose --profile app up -d --build
  # Seed it once, no API key needed: docker compose --profile app run --rm api lore seed --from <path or URL>
  api:
    <<: *yaan
    profiles: ["app"]
    ports:
      - "127.0.0.1:${LORE_API_PORT:-8000}:8000" # put a TLS proxy in front for a public deployment

  # Sign-in with Google, Okta, Entra ID or any OIDC provider, in front of the API (D133):
  # LORE_AUTH=header, LORE_AUTH_PROXY_SECRET and the OAUTH2_PROXY_* settings in .env, then
  #   docker compose --profile app --profile sso up -d     (then open http://127.0.0.1:4180)
  # oauth2-proxy proves itself to Yaan with Basic auth: <email>:<LORE_AUTH_PROXY_SECRET>.
  sso:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    profiles: ["sso"]
    restart: always
    depends_on: [api]
    ports:
      - "127.0.0.1:${LORE_SSO_PORT:-4180}:4180" # put a TLS proxy in front for a public deployment
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://api:8000"
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-oidc}
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL:-http://127.0.0.1:4180/oauth2/callback}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:-}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # who signed in, to Yaan: Basic <email>:<the shared secret> plus X-Forwarded-Email
      OAUTH2_PROXY_PASS_BASIC_AUTH: "true"
      OAUTH2_PROXY_PREFER_EMAIL_TO_USER: "true"
      OAUTH2_PROXY_BASIC_AUTH_PASSWORD: ${LORE_AUTH_PROXY_SECRET:-}
      # tools' webhooks and the health check come without a person
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "POST=^/hooks/,GET=^/health$"

  # The connector loop (H1, D108): its own container, so Docker restarts it after a crash or a
  # reboot, and its healthcheck notices a loop that stopped making rounds.
  #   docker compose --profile app --profile connectors up -d
  worker:
    <<: *yaan
    profiles: ["connectors"]
    command: ["yaan", "connectors", "run"]
    healthcheck:
      # unhealthy when the next round is overdue (runner.worker_health reads its heartbeat)
      test: ["CMD", "yaan", "connectors", "health"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 180s

volumes:
  falkordb-data:
