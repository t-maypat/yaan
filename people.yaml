# People (org mode only, LORE_DATA_MODE=org; the demo ignores this file).
#
# Yaan registers anyone it meets in a connected tool on its own, under their name in that tool.
# List people here to give them a role and to merge their accounts across tools into one person.
# The role is what the authority policy reads when someone says an issue is fixed, dismissed or
# back:
#   - the issue's assignee may always change it;
#   - an Engineering Lead, VP of Engineering, Product Manager, Chief Product Officer or QA
#     Specialist who works on the product may change it;
#   - anyone else with a role here (say, Software Engineer): the claim is recorded but refused,
#     and Yaan raises a conflict alert;
#   - someone with no role (not listed, or listed without one): the claim applies, marked
#     unverified.
#
# Account ids: Slack member id (Profile > ... > Copy member ID), GitHub login, Jira account id,
# Notion user id. A list gives one person several accounts in the same tool.
#
# people:
#   - name: Priya Shah
#     email: priya@example.com        # optional; with no email the id comes from the name
#     role: Engineering Lead
#     accounts:
#       slack: U0123ABCDEF
#       github: priya-s
#       jira: 5b10ac8d82e05b22cc7d4ef5
#   - name: Ken Ito
#     role: QA Specialist
#     accounts: {slack: U0456GHIJKL, github: kito}
people: []
