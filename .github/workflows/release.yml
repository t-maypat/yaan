# Release: on a version tag (v0.2.0 …), publish the image to GitHub's registry and open a
# GitHub release with that version's CHANGELOG section. The demo snapshot isn't built here (it
# needs the HERB data and the extracted events): the maintainer runs `yaan snapshot`, commits
# the line it writes to snapshots/SHA256SUMS before tagging, then uploads the file:
#   gh release upload v0.2.0 snapshots/lore-snapshot.tar.gz snapshots/SHA256SUMS
# `yaan seed` refuses a snapshot whose sha256 the checkout's SHA256SUMS doesn't pin (D111).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release
  packages: write # ghcr.io/<owner>/yaan

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/yaan" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest

  release:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The pin the snapshot must match is in the tagged tree
        run: test -s snapshots/SHA256SUMS
      - name: This version's notes, from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' section"; exit 1; }
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md snapshots/SHA256SUMS
