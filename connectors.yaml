# Connector maps (Phase 17, D073-D074). The demo sandboxes play VizForce's team and hold only
# labeled synthetic items ("[synthetic demo …]"); everything they send lands in the demo graph.
# A seeded item can name the person it is written as: "[synthetic demo · as Name (eid_…)]".
product: VizForce
default_person: eid_bd791efc        # David Garcia, Engineering Lead: who an unmapped account plays
slack:
  channels:                          # Slack channel name -> the VizForce channel it plays
    vizforce-bugs: ch-force-d79648    # bug-davidgarcia-VizForce
  alerts_channel: yaan-alerts        # alert cards with Approve / Dismiss, and notifications
  people: {}                         # Slack user id -> eid
github:
  people:                            # GitHub login -> eid; "self" = the token's own login
    self: eid_9e9883de               # Hannah Garcia, Software Engineer: writes the fix
jira:
  channel: ch-force-d79648           # ticket changes are filed as messages in this channel
  people:                            # Jira account id -> eid; "self" = the token's own account
    self: eid_9e9883de               # Hannah Garcia: the ticket's assignee, who resolves it
notion:
  channel: ch-vizai-afe877           # planning-VizForce: where Notion documents are shared
  people: {}                         # Notion user id -> eid
