    vizforce-bugs: ch-force-d79648    # bug-davidgarcia-VizForce
  alerts_channel: lore-alerts        # alert cards with Approve / Dismiss, and notifications
  people: {}                         # Slack user id -> eid
github:
  people: {}                         # GitHub login -> eid
jira:
  channel: ch-force-d79648           # ticket changes are filed as messages in this channel
  people: {}                         # Jira account id -> eid
notion:
  people: {}                         # Notion user id -> eid
